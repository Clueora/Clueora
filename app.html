<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clueora – Research Guide</title>
  <meta name="description" content="Clueora helps kids research homework with clues and credible sources — never the final answer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #2EC4B6;
      --teal-dark: #1A9B8F;
      --coral: #FF6B6B;
      --navy: #1B2A41;
      --gray: #5A6A7A;
      --light: #F7FBFB;
      --white: #FFFFFF;
      --shadow: 0 8px 24px rgba(27, 42, 65, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--light);
      color: var(--navy);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      border-bottom: 1px solid rgba(46, 196, 182, 0.15);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--navy);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .badge {
      background: #E0F7F5;
      color: var(--teal-dark);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.55;
      font-size: 0.98rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot {
      background: white;
      border: 1px solid rgba(46, 196, 182, 0.2);
      align-self: flex-start;
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow);
    }

    .message.user {
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }

    .message.bot strong {
      color: var(--teal-dark);
    }

    .clue-box {
      background: #FFF8E7;
      border-left: 4px solid #F4A261;
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
    }

    .source-list {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    .source-list li {
      margin-bottom: 6px;
    }

    .source-list a {
      color: var(--teal-dark);
      font-weight: 500;
    }

    .input-area {
      background: white;
      border-top: 1px solid rgba(46, 196, 182, 0.15);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 2px solid #E0E7E7;
      border-radius: 16px;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      min-height: 52px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--teal);
    }

    button.send {
      background: linear-gradient(135deg, var(--teal), var(--teal-dark));
      color: white;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.send:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(46, 196, 182, 0.4);
    }

    button.send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--teal);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .disclaimer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--gray);
      padding: 8px;
      background: #FFF8E7;
    }

    @media (max-width: 600px) {
      .message { max-width: 92%; }
      .chat-container { padding: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="logo.png" alt="Clueora">
    </a>
    <span class="badge">Prototype • Clues only</span>
  </header>

  <div class="disclaimer">
    This is an early prototype. Clueora never gives the final answer — only research clues and trusted sources.
  </div>

  <div class="chat-container" id="chat">
    <!-- Messages will appear here -->
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Type your homework question here..." rows="1"></textarea>
      <button class="send" id="sendBtn" title="Send">➤</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // Welcome message
    addBotMessage(`Hi! I'm Clue 🦉<br><br>
      I help you <strong>find</strong> answers instead of giving them to you.<br><br>
      Ask me any homework question and I'll give you clues and trusted places to look.`);

    function addBotMessage(html) {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'message user';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    // Simple but effective response engine (prototype)
    function generateResponse(question) {
      const q = question.toLowerCase();

      // Math-related
      if (q.includes('fraction') || q.includes('multiply') || q.includes('divide') || q.includes('add') || q.includes('subtract') || q.includes('equation') || q.includes('math')) {
        return `
          Great question! Let's figure this out together.<br><br>
          <div class="clue-box">
            <strong>Clue 1:</strong> First, identify what kind of problem this is (adding, multiplying, solving for a variable, etc.).
          </div>
          <div class="clue-box">
            <strong>Clue 2:</strong> Write down the numbers and the operation. What do you already know how to do?
          </div>
          <strong>Trusted places to look:</strong>
          <ul class="source-list">
            <li><a href="https://www.khanacademy.org/math" target="_blank">Khan Academy – Math</a></li>
            <li><a href="https://www.mathsisfun.com" target="_blank">Math is Fun</a></li>
            <li><a href="https://www.bbc.co.uk/bitesize/subjects/z38pycw" target="_blank">BBC Bitesize Math</a></li>
          </ul>
          Try looking at one of these and come back if you get stuck on a specific step!`;
      }

      // Science
      if (q.includes('photosynthesis') || q.includes('planet') || q.includes('atom') || q.includes('force') || q.includes('energy') || q.includes('cell') || q.includes('science') || q.includes('gravity')) {
        return `
          Awesome science question!<br><br>
          <div class="clue-box">
            <strong>Clue 1:</strong> Start by finding a simple definition or diagram of the main concept.
          </div>
          <div class="clue-box">
            <strong>Clue 2:</strong> Look for an example or experiment that shows how it works in real life.
          </div>
          <strong>Trusted places to look:</strong>
          <ul class="source-list">
            <li><a href="https://www.nationalgeographic.com/science" target="_blank">National Geographic – Science</a></li>
            <li><a href="https://www.khanacademy.org/science" target="_blank">Khan Academy – Science</a></li>
            <li><a href="https://www.britannica.com" target="_blank">Britannica</a></li>
            <li><a href="https://www.nasa.gov/audience/forstudents/" target="_blank">NASA for Students</a></li>
          </ul>
          Read one short article and tell me what you found!`;
      }

      // History / Social Studies
      if (q.includes('war') || q.includes('president') || q.includes('ancient') || q.includes('civilization') || q.includes('history') || q.includes('revolution') || q.includes('king') || q.includes('queen')) {
        return `
          History is full of clues!<br><br>
          <div class="clue-box">
            <strong>Clue 1:</strong> Find out <em>when</em> and <em>where</em> this happened first.
          </div>
          <div class="clue-box">
            <strong>Clue 2:</strong> Look for the main people involved and what they wanted.
          </div>
          <strong>Trusted places to look:</strong>
          <ul class="source-list">
            <li><a href="https://www.britannica.com" target="_blank">Britannica</a></li>
            <li><a href="https://www.history.com" target="_blank">History.com</a></li>
            <li><a href="https://www.bbc.co.uk/history" target="_blank">BBC History</a></li>
            <li><a href="https://www.nationalgeographic.com/history" target="_blank">National Geographic – History</a></li>
          </ul>
          Start with one reliable article and note the key facts.`;
      }

      // Reading / Writing / English
      if (q.includes('essay') || q.includes('paragraph') || q.includes('character') || q.includes('theme') || q.includes('poem') || q.includes('book') || q.includes('story') || q.includes('write')) {
        return `
          Let's strengthen your writing and reading skills.<br><br>
          <div class="clue-box">
            <strong>Clue 1:</strong> Identify the main idea or the question you need to answer.
          </div>
          <div class="clue-box">
            <strong>Clue 2:</strong> Find 2–3 pieces of evidence or examples from the text (or your research).
          </div>
          <strong>Trusted places to look:</strong>
          <ul class="source-list">
            <li><a href="https://www.khanacademy.org/humanities" target="_blank">Khan Academy – Humanities</a></li>
            <li><a href="https://www.britannica.com" target="_blank">Britannica</a></li>
            <li><a href="https://owl.purdue.edu" target="_blank">Purdue OWL (writing help)</a></li>
          </ul>
          Try outlining your ideas first before writing full sentences.`;
      }

      // Default response
      return `
        Good question! Let's investigate it the Clueora way.<br><br>
        <div class="clue-box">
          <strong>Clue 1:</strong> Break the question into smaller parts. What is it really asking?
        </div>
        <div class="clue-box">
          <strong>Clue 2:</strong> Search for the key words on a trusted educational site.
        </div>
        <strong>Start with these reliable sources:</strong>
        <ul class="source-list">
          <li><a href="https://www.britannica.com" target="_blank">Britannica</a></li>
          <li><a href="https://www.khanacademy.org" target="_blank">Khan Academy</a></li>
          <li><a href="https://www.nationalgeographic.com" target="_blank">National Geographic</a></li>
          <li><a href="https://www.bbc.co.uk/bitesize" target="_blank">BBC Bitesize</a></li>
        </ul>
        Look up the main topic on one of these sites and come back with what you discover. I'll help you with the next clue!`;
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text) return;

      addUserMessage(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      showTyping();

      // Simulate thinking time
      setTimeout(() => {
        hideTyping();
        const response = generateResponse(text);
        addBotMessage(response);
        sendBtn.disabled = false;
        input.focus();
      }, 900 + Math.random() * 600);
    }

    sendBtn.addEventListener('click', handleSend);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Auto-resize textarea
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
